# Compression des réponses (site, mobile, API) par nginx.
# Les données et fichiers voyagent jusqu'à 30 fois plus légers (ex. liste des ventes :
# 7,2 Mo -> 220 Ko). Une réponse déjà compressée par Spring Boot n'est pas recompressée.
#
# Installation sur le VPS :
#   1. copier ce fichier dans /etc/nginx/snippets/compression.conf
#   2. dans le bloc "server { listen 443 ... }" de CHAQUE boutique, ajouter la ligne :
#          include /etc/nginx/snippets/compression.conf;
#      (juste sous la ligne server_name, comme dans nginx-barandjim.conf)
#   3. sudo nginx -t          (doit répondre "syntax is ok" et "test is successful")
#   4. sudo systemctl reload nginx
# Placées dans le bloc server, ces lignes remplacent les réglages généraux de nginx.conf
# sans conflit.

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/manifest+json
    image/svg+xml
    font/ttf
    font/otf;
