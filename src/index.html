<!doctype html>
<html lang="en" dir="ltr">

<head>
    <meta charset="utf-8">
    <title>Ges-Boutique</title>
    <base href="/">

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/x-icon" href="assets/images/logo.png">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#27ae60">

    <script>
      // Bascule le manifeste AVANT même qu'Angular ne démarre, pour un chargement direct
      // sur /vitrine (ex: ouverture de l'app PWA déjà installée). Sans ça, le manifeste de
      // l'appli de gestion du personnel (start_url="/") reste actif le temps qu'Angular
      // charge, ce qui peut faire échouer la détection d'installabilité côté navigateur.
      // La bascule en navigation interne (SPA, sans rechargement complet) est gérée par
      // vitrine.component.ts. Ici on pointe vers une vraie ressource HTTP (pas un blob:),
      // plus fiable pour le moteur d'installation "Ajouter à l'écran d'accueil".
      if (location.pathname.indexOf('/vitrine') === 0) {
        var lienManifeste = document.querySelector('link[rel="manifest"]');
        if (lienManifeste) lienManifeste.setAttribute('href', '/api/vitrine/manifest.webmanifest');
      }
    </script>


</head>

<body class="text-left">
    <app-root>
        <div class="loadscreen">
            <img src="assets/images/logo.png" class="logo mb-3" style="display: none" alt="">
            <div class="loader-bubble loader-bubble-primary d-block"></div>
        </div>
    </app-root>

  <noscript>Please enable JavaScript to continue using this application.</noscript>

</body>

</html>
