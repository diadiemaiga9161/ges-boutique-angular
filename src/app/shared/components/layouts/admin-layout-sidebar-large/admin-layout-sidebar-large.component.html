<div class="app-admin-wrap layout-sidebar-large edu-shell">
  <app-sidebar-large></app-sidebar-large>

  <div class="edu-main">
    <app-header-sidebar-large></app-header-sidebar-large>

    <ng-scrollbar class="edu-content-scroll" visibility="hover" appearance="compact">
      <app-loading-bar></app-loading-bar>
      <main class="edu-content d-flex flex-column">
        <router-outlet></router-outlet>
        @if (moduleLoading) {
          <div class="module-loader">
            <div class="spinner spinner-bubble spinner-bubble-primary me-3"></div>
          </div>
        }
      </main>
      <app-footer></app-footer>
    </ng-scrollbar>
  </div>
</div>

<!-- Mobile Bottom Navigation -->
<nav class="mobile-bottom-nav d-flex d-md-none">
  <a class="mobile-nav-item" routerLink="/vente" routerLinkActive="active">
    <i class="i-Money-2"></i>
    <span>Ventes</span>
  </a>
  <a *ngIf="authService.isAdmin()" class="mobile-nav-item" routerLink="/caisse" routerLinkActive="active">
    <i class="i-Cash-register-2"></i>
    <span>Caisse</span>
  </a>
  <a class="mobile-nav-item" routerLink="/produit" routerLinkActive="active">
    <i class="i-Clothing-Store"></i>
    <span>Produits</span>
  </a>
  <a class="mobile-nav-item" routerLink="/client" routerLinkActive="active">
    <i class="i-Business-ManWoman"></i>
    <span>Clients</span>
  </a>
  <a class="mobile-nav-item" routerLink="/profile" routerLinkActive="active">
    <i class="i-Administrator"></i>
    <span>Profil</span>
  </a>
  <button class="mobile-nav-item mobile-nav-logout" (click)="logout()">
    <i class="i-Lock-User"></i>
    <span>Quitter</span>
  </button>
</nav>

@if (searchService.searchOpen) {
  <app-search></app-search>
}
