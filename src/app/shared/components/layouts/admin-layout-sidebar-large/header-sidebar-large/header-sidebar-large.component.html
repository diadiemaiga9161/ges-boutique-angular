<header class="edu-topbar">
  <div class="topbar-left">
    <button class="icon-btn d-md-none" type="button" aria-label="Ouvrir le menu" (click)="toggelSidebar()">
      <i class="i-Align-Justify-All"></i>
    </button>
    <img class="school-logo d-none d-sm-block" [src]="logoPath" alt="logo" />
    <div>
      <span>Bienvenue</span>
      <strong>{{ boutiqueName }}</strong>
    </div>
  </div>

  <div class="topbar-search" (click)="searchService.searchOpen = true">
    <i class="i-Magnifi-Glass1"></i>
    <input type="search" placeholder="Rechercher..." readonly />
  </div>

  <div class="topbar-actions">
    <app-notification-bell></app-notification-bell>

    <!-- Badge transferts en attente -->
    <a routerLink="/transferts" class="icon-btn" title="Transferts en attente">
      <i class="i-Arrow-Right"></i>
      <b class="badge-count" *ngIf="transfertCount > 0">{{ transfertCount > 99 ? '99+' : transfertCount }}</b>
    </a>

    <!-- Badge commandes vitrine en attente -->
    <a routerLink="/commandes" class="icon-btn" title="Commandes en ligne en attente">
      <i class="i-Cash-register-2"></i>
      <b class="badge-count" *ngIf="commandeVitrineCount > 0">{{ commandeVitrineCount > 99 ? '99+' : commandeVitrineCount }}</b>
    </a>

    <!-- Sélecteur de langue (Angular pur, sans Bootstrap JS) -->
    <div class="lang-dropdown">
      <button class="icon-btn" type="button" (click)="toggleLangMenu($event)" title="{{ 'LANG.SELECT' | translate }}">
        <span class="lang-flag">{{ langService.getCurrentLanguage().flag }}</span>
      </button>
      <ul *ngIf="showLangMenu" class="lang-menu" (click)="$event.stopPropagation()">
        <li *ngFor="let lang of langService.languages">
          <button class="lang-item"
                  [class.active]="lang.code === langService.getCurrentCode()"
                  (click)="setLang(lang.code)">
            <span class="lang-item-flag">{{ lang.flag }}</span>
            <span class="lang-item-name">{{ lang.name }}</span>
            <i class="i-Yes ms-auto text-success" *ngIf="lang.code === langService.getCurrentCode()"></i>
          </button>
        </li>
      </ul>
    </div>

    <app-offline-badge></app-offline-badge>

    <a class="user-chip" routerLink="/profile">
      <img *ngIf="userPhoto" [src]="userPhoto" alt="photo" />
      <i *ngIf="!userPhoto" class="i-Administrator user-chip-icon"></i>
      <span class="d-none d-md-inline">{{ currentUserName }}</span>
      <em class="d-none d-md-inline">{{ currentUserRole }}</em>
    </a>

    <button class="icon-btn" type="button" (click)="logout()" title="{{ 'PROFILE.LOGOUT' | translate }}">
      <i class="i-Lock-User"></i>
    </button>
  </div>
</header>
