<div class="search-overlay" (click)="searchService.searchOpen = false">
  <div class="gl-search-panel" [@animate]="{value:'*',params:{y:'40px',opacity:'0',delay:'50ms', duration: '250ms'}}" (click)="$event.stopPropagation()">
    <div class="gl-search-header">
      <i class="i-Magnifi-Glass1 search-icon"></i>
      <input
        type="text"
        placeholder="Rechercher un produit, un client..."
        class="gl-search-input"
        [formControl]="searchCtrl"
        autofocus>
      <button class="close-btn" type="button" (click)="searchService.searchOpen = false" aria-label="Fermer">
        <i class="i-Close-Window"></i>
      </button>
    </div>

    <div class="search-results">
      @if (searchCtrl.value?.trim()) {
        @for (item of results$ | async; track item) {
          <button class="result-item" type="button" (click)="ouvrirResultat(item)">
            <span class="result-icon" [class.client]="item.type === 'client'"><i [class]="item.icon"></i></span>
            <span class="result-text">
              <strong>{{ item.titre }}</strong>
              <small>{{ item.sousTitre }}</small>
            </span>
            <span class="result-type">{{ item.type === 'produit' ? 'Produit' : 'Client' }}</span>
          </button>
        } @empty {
          <div class="empty-state">Aucun résultat pour "{{ searchCtrl.value }}"</div>
        }
      } @else {
        <div class="empty-state">Tapez pour rechercher un produit ou un client.</div>
      }
    </div>
  </div>
</div>
