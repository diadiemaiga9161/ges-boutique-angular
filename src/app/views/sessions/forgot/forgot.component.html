<div class="login-page">
  <div class="login-frame">

    <!-- Panneau de marque -->
    <div class="login-brand">
      <div class="ledger-rules" aria-hidden="true"></div>

      <div class="brand-top">
        <img [src]="logoPath" alt="" class="brand-logo" *ngIf="logoPath" />
        <span class="brand-word">GesLafia</span>
      </div>

      <div class="brand-mid">
        <p class="brand-tagline">Un compte protégé,<br />comme votre boutique.</p>
        <p class="brand-sub">Un lien de réinitialisation valable une seule fois.</p>
      </div>

      <div class="perforation" aria-hidden="true"></div>
    </div>

    <!-- Panneau du formulaire -->
    <div class="login-form-panel">
      <div class="form-inner">
        <div class="form-head">
          <h1 class="form-title">Mot de passe oublié</h1>
          <p class="form-hint">Saisissez votre email, vous recevrez un lien pour le réinitialiser.</p>
        </div>

        <div class="banner banner--ok" *ngIf="successMessage" role="status">
          <span class="banner-mark">✓</span>
          <span>{{ successMessage }}</span>
        </div>

        <div class="banner banner--err" *ngIf="errorMessage" role="alert">
          <span class="banner-mark">!</span>
          <span>{{ errorMessage }}</span>
        </div>

        <form (ngSubmit)="submit()" *ngIf="!successMessage" class="login-form" novalidate>
          <label class="field">
            <span class="field-icon" aria-hidden="true">✉️</span>
            <input
                   name="email"
                   [(ngModel)]="email"
                   type="email"
                   placeholder="votre@email.com"
                   autocomplete="email"
                   required
                   [disabled]="isLoading" />
          </label>

          <button type="submit" class="btn-submit" [disabled]="isLoading || !email">
            <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2"></span>
            <span>{{ isLoading ? 'Envoi…' : 'Envoyer le lien' }}</span>
          </button>
        </form>

        <div class="signup-row">
          <a routerLink="/connexion">Retour à la connexion</a>
        </div>
      </div>
    </div>

  </div>
</div>
